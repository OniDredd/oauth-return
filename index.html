<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Never send this page's address (it holds a one-time sign-in code) to another site. -->
<meta name="referrer" content="no-referrer">
<title>Finishing sign-in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #161514; color: #e6e3df; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 420px; padding: 24px; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 8px; }
  p { margin: 0; color: #a6a19b; }
</style>
</head>
<body>
<main>
  <h1>Finishing sign-in</h1>
  <p id="note">Taking you back to the app on this computer.</p>
</main>
<script>
  // Sign-in return page for a desktop app. The sign-in service sends the browser here
  // (HTTPS is required), and this page passes the one-time code straight on to the app,
  // which listens only on this computer. The code is useless without the app's secret,
  // which never leaves that computer. Nothing is stored or sent anywhere else.
  (function () {
    var query = window.location.search;
    if (!query) {
      document.getElementById("note").textContent = "Nothing to pass on. You can close this tab.";
      return;
    }
    window.location.replace("http://127.0.0.1:47811/callback" + query);
  })();
</script>
</body>
</html>
